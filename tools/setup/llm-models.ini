; =====================================================================
;  Hain · llama.cpp Router-Presets (eine Datei, ein Server, Port 8080)
;  setup-local-agent.sh kopiert sie nach ~/.config/llm/models.ini
;  und ersetzt @HOME@ durch deinen Home-Pfad.
;
;  Der Router lädt IMMER NUR EIN Modell (--models-max 1). Wählst du in pi
;  ein anderes Modell, entlädt er das alte automatisch, dann lädt er das neue.
;  Nach 15 min ohne Anfrage schläft er und gibt VRAM/RAM frei.
; =====================================================================
version = 1

; ---------- gilt für alle Modelle ----------
[*]
ngl = 99
parallel = 1
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
chat-template-kwargs = {"preserve_thinking":true}
no-context-shift = true
; Qwen3.5/3.6-Architektur ist hybrid: ohne Checkpoints wird der Prompt jedes Mal neu verarbeitet
ctx-checkpoints = 32
checkpoint-min-step = 0
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
presence-penalty = 0
reasoning-budget-message = Genug nachgedacht. Handle jetzt.

; ---------- Hauptmodell: Qwen3.6-35B-A3B (MoE), Experten teils im RAM ----------
[qwen-moe]
model = @HOME@/models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
; feste VRAM-Aufteilung statt Automatik: HÖHER = weniger VRAM. 33..38, nie über 39
fit = off
n-cpu-moe = 35
ctx-size = 65536
batch-size = 1024
ubatch-size = 256
threads = 4
threads-batch = 8
reasoning-budget = 12288

; ---------- Schnell & klein: FrogNano-4B, komplett im VRAM ----------
[frognano]
model = @HOME@/models/frognano/FrogNano-4B-2609-Q6_K.gguf
ctx-size = 65536
batch-size = 1024
ubatch-size = 512
threads = 4
reasoning-budget = 6144
