# Open-source licences shown in Settings → Über Hain → Open-source-Lizenzen (T-285).
#
# This file is the source; tools/licenses/gen_licenses.py turns it into
# feature-settings/src/main/assets/licenses/licenses.json and copies the licence texts from
# tools/licenses/texts/ next to it. Run it after every dependency, model, font or icon change:
#
#     python3 tools/licenses/gen_licenses.py          # write the assets
#     python3 tools/licenses/gen_licenses.py --check  # CI: nothing missing, assets up to date
#
# Each [[entry]]:
#   group    libraries | models | fonts | icons | engine | content (order of the page)
#   name     shown as is
#   version  literal, or "toml:<key>" (gradle/libs.versions.toml [versions])
#   licence  licence name as shown
#   url      project page (opened in the browser only after a tap)
#   texts    files in tools/licenses/texts/, shown one after the other
#   md       a word that must appear in docs/specs/LICENSES.md (every component has a row there)
#   gradle   aliases of gradle/libs.versions.toml this entry covers (runtime dependencies)
#   catalog  ids of core-models/src/main/assets/catalog.json this entry covers
#   fonts    file name prefixes in core-ui/src/main/res/font/ this entry covers
#   submodule + sha: the pinned submodule must still be at this commit (else update version)

[app]
name = "Hain"
licence = "GPL-3.0"
url = "https://github.com/oskar26/hain"
texts = ["gpl-3.0.txt"]

