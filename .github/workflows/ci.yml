name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: assemble · test · lint · strings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # KI-01: the Gradle daemon is pinned to JDK 21 via
      # gradle/gradle-daemon-jvm.properties and is auto-provisioned by the
      # foojay resolver in settings.gradle.kts. JDK 17 here is only the
      # launcher/toolchain JVM the task card asks for.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest ktlintCheck detekt

      - name: String parity check (DE/EN)
        run: python3 tools/check_strings.py

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/ktlint/
          if-no-files-found: ignore
