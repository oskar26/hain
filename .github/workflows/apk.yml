name: APK

# Builds an installable APK for every pull request and every push to main.
# Pushes to main also refresh the "nightly" pre-release, so the newest APK is
# always at: Releases → nightly → hain-debug.apk (same debug key → installs as update).
# T-212: every release also gets a small version.json (versionCode, versionName, commit, date,
# channel) that the app's optional update check reads. Tags v* get a normal release with both files.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.31.6" > /dev/null

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: core-llm/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('core-llm/src/main/cpp/**', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            cxx-${{ runner.os }}-${{ hashFiles('core-llm/src/main/cpp/**', '.gitmodules') }}-

      - name: Build APK
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >
          ./gradlew :app:assembleDebug -Phain.fastDebug=true -Phain.versionCode=${{ github.run_number }}
          -Phain.commit=$HEAD_SHA -Phain.buildDate=$(date -u +%Y-%m-%d) --stacktrace

      - name: Rename APK + version.json
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/hain-debug.apk
          echo "Built from ${GITHUB_SHA::7} (${GITHUB_REF_NAME}), build ${{ github.run_number }}" > out/BUILD.txt
          NAME=$(grep '^hain.versionName=' gradle.properties | cut -d= -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then CHANNEL=stable; else CHANNEL=nightly; fi
          printf '{"versionCode": %s, "versionName": "%s", "commit": "%s", "date": "%s", "channel": "%s"}\n' \
            "${{ github.run_number }}" "$NAME" "$HEAD_SHA" "$(date -u +%Y-%m-%d)" "$CHANNEL" > out/version.json
          cat out/version.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hain-debug-${{ github.run_number }}
          path: |
            out/hain-debug.apk
            out/version.json
          retention-days: 14

      - name: Publish nightly pre-release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly out/hain-debug.apk out/version.json \
            --prerelease --target "$GITHUB_SHA" \
            --title "Nightly · build ${{ github.run_number }}" \
            --notes-file out/BUILD.txt

      - name: Publish tagged release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Hain $GITHUB_REF_NAME" --notes-file out/BUILD.txt
          gh release upload "$GITHUB_REF_NAME" out/hain-debug.apk out/version.json --clobber
