name: Screens

# Renders the design screenshots (T-011 / T-085) with Roborazzi + Robolectric native graphics,
# which need an x86 Linux host. The PNGs are uploaded as the "screens" artifact; the ones worth
# keeping are copied to docs/design/screens/ in the PR. Does not block merging.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    name: record screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (with llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Record screenshots
        run: >
          ./gradlew :core-ui:testDebugUnitTest :feature-chat:testDebugUnitTest
          :feature-settings:testDebugUnitTest :feature-onboarding:testDebugUnitTest :feature-news:testDebugUnitTest
          :feature-memory:testDebugUnitTest
          --tests '*.screens.*' --continue -Phain.native=false -Phain.screens=true -Proborazzi.test.record=true --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: '**/build/outputs/roborazzi/**/*.png'
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  # T-190: the minified release APK (R8 + shrinkResources + baseline profile) must install and start.
  # Builds it signed with the public debug key (only for this test), starts it on an x86_64 emulator
  # (Android 11 images run the arm64 native libraries through ARM translation), checks the process
  # survives, that the baseline profile got installed, and measures cold start against the nightly
  # debug APK of main. The report is in the job summary and in the "release-smoke" artifact.
  release-smoke:
    name: release APK starts (R8) + start time
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (with llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.31.6" > /dev/null

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: core-llm/.cxx
          key: cxx-release-${{ runner.os }}-${{ hashFiles('core-llm/src/main/cpp/**', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            cxx-release-${{ runner.os }}-${{ hashFiles('core-llm/src/main/cpp/**', '.gitmodules') }}-

      - name: Build release APK (R8)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >
          ./gradlew :app:assembleRelease -Phain.signReleaseWithDebugKey=true
          -Phain.commit=$HEAD_SHA -Phain.buildDate=$(date -u +%Y-%m-%d) --stacktrace

      - name: Check APK contents
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          unzip -l "$APK" | grep -E 'assets/dexopt/baseline\.prof|libhain_llm\.so|classes[0-9]*\.dex' | tee apk-contents.txt
          grep -q 'assets/dexopt/baseline.prof' apk-contents.txt || { echo "::error::baseline profile missing in the APK"; exit 1; }
          grep -q 'libhain_llm.so' apk-contents.txt || { echo "::error::native llama library missing in the APK"; exit 1; }

      - name: Download the nightly debug APK of main (start time "before")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p before
          gh release download nightly --repo "$GITHUB_REPOSITORY" -p hain-debug.apk -D before || echo "no nightly APK, measuring only the release APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator, install, start, measure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash tools/ci/release_smoke.sh app/build/outputs/apk/release/app-release.apk before/hain-debug.apk app/build/outputs/mapping/release/mapping.txt

      - name: Job summary
        if: always()
        run: |
          [ -f smoke/report.md ] && cat smoke/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload release APK + smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
            smoke/
          if-no-files-found: warn
          retention-days: 14
