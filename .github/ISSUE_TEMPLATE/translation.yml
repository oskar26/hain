name: "🌍 Übersetzung und Texte / Translation and texts"
description: Ein Text ist falsch, schwer verständlich oder fehlt in einer Sprache. / A text is wrong, hard to understand or missing.
title: "[Text] "
labels: ["uebersetzung", "triage"]
body:
  - type: input
    id: where
    attributes:
      label: Wo in der App? / Where in the app?
      placeholder: z. B. Einstellungen → Antworten
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: Aktueller Text / Current text
  - type: textarea
    id: suggestion
    attributes:
      label: Vorschlag / Suggestion
